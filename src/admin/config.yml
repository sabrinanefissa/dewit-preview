            label: "Closing call to action (in the footer)"
            summary: "Close — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Image
