              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Heading (the page's h1), name: heading, widget: string, hint: "Allows *emphasis*." }
              - { label: Sentences, name: lead, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
              - label: The org chart
                name: chart
                widget: object
                fields:
                  - { label: Description (for screen readers), name: label, widget: string }
                  - { label: "Caption (optional, shown under it)", name: caption, widget: string, required: false }
                  - { label: Role titles in the boxes (top to bottom, left to right), name: roles, widget: list, required: false, field: { label: Role, name: role, widget: string } }
                  - { label: Phrases on the lines between people, name: phrases, widget: list, required: false, field: { label: Phrase, name: phrase, widget: string } }
