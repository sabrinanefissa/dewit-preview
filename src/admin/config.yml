backend:
  name: github
  repo: sabrinanefissa/dewit-preview
  branch: main

media_folder: assets/img
public_folder: assets/img
site_url: https://sabrinanefissa.github.io/dewit-preview

# Sign-in: token sign-in only (Sveltia's built-in GitHub personal-access-token
# flow). No OAuth function — see EDITING.md for how an editor signs in.

collections:
  - name: pages
    label: Pages
    folder: content/pages
    extension: json
    format: json
    create: false
    delete: false
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string, hint: "Allows *emphasis* and **bold**." }
      - { label: Description, name: description, widget: text, hint: "Allows *emphasis* and **bold**." }
      - { label: Extra stylesheets, name: styles, widget: list, field: { label: Path, name: path, widget: string }, required: false, hint: "Extra stylesheet paths for this page, e.g. css/keynotes.css" }
      - { label: Extra scripts, name: scripts, widget: list, field: { label: Path, name: path, widget: string }, required: false, hint: "Extra script paths for this page, e.g. js/keynotes.js" }
      - { label: Canonical URL, name: canonical, widget: string }
      - label: Social preview (og)
        name: og
        widget: object
        fields:
          - { label: Title, name: title, widget: string, hint: "Allows *emphasis* and **bold**." }
          - { label: Description, name: description, widget: text, hint: "Allows *emphasis* and **bold**." }
          - { label: URL, name: url, widget: string }
          - { label: Image, name: image, widget: string, hint: "Full https:// URL (used by link previews, not the img widget)." }
      - { label: "Loading screen (Home only; one page site-wide)", name: loader, widget: boolean, default: false, required: false }
      - label: "Video schema (VideoObject JSON-LD, Speaking)"
        name: videoSchema
        widget: object
        required: false
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Thumbnail URL (full https://), name: thumbnailUrl, widget: string }
          - { label: Video file URL (full https://), name: contentUrl, widget: string }
          - { label: "Duration (ISO 8601, e.g. PT2M40S)", name: duration, widget: string }
          - { label: "Upload date (YYYY-MM-DD; leave empty until known)", name: uploadDate, widget: string, required: false }
      - label: Ground (speaking page only)
        name: ground
        widget: object
        required: false
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
          - { label: Show colour veil, name: veil, widget: boolean, default: true }

      - label: Blocks
        name: blocks
        widget: list
        collapsed: auto
        allow_add: true
        add_to_top: false
        summary: "{{fields.type}} — {{fields.heading}}{{fields.statement}}"
        types:

          # ---------------------------------------------------------- hero
          - name: hero
            label: "Hero with video"
            summary: "Hero — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Poster image
                name: poster
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
                  - { label: Alt text, name: alt, widget: string }
              - label: Ambient video loop
                name: video
                widget: object
                fields:
                  - { label: Poster (frame), name: poster, widget: image }
                  - { label: WebM file, name: webm, widget: file, media_folder: "/assets/video" }
                  - { label: MP4 file, name: mp4, widget: file, media_folder: "/assets/video" }
                  - { label: MP4 file (small), name: mp4Sm, widget: file, media_folder: "/assets/video" }
              - { label: Heading, name: heading, widget: string, hint: "Allows *emphasis* and **bold**." }
              - label: Play button
                name: play
                widget: object
                fields:
                  - { label: Video file (plays on click), name: video, widget: file, media_folder: "/assets/video" }
                  - { label: Aria label, name: ariaLabel, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Small label, name: small, widget: string }
              - { label: "Meta line(s)", name: meta, widget: list, field: { label: Line, name: line, widget: string, hint: "Allows **bold**." } }
              - &placement
                label: Position on the image
                name: placement
                widget: object
                required: false
                collapsed: true
                hint: "Where this text sits over its picture. Leave empty to keep the design's own position."
                fields: &placement-fields
                  - &place-x { label: "X (across)", name: x, widget: number, value_type: float, min: 0, max: 100, required: false, hint: "0 = left edge, 50 = middle, 100 = right edge" }
                  - &place-y { label: "Y (down)", name: y, widget: number, value_type: float, min: 0, max: 100, required: false, hint: "0 = top, 50 = middle, 100 = bottom" }
                  - &place-align { label: Text alignment, name: align, widget: select, options: [left, center, right], required: false }
                  - &place-max { label: Max width, name: maxWidth, widget: string, required: false, hint: "e.g. 16ch, or none" }
                  - label: Phones
                    name: mobile
                    widget: object
                    required: false
                    collapsed: true
                    hint: "Phones. Leave empty to use the same as desktop"
                    fields: [*place-x, *place-y, *place-align, *place-max]
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Headline words: gap between words (ms)", name: stagger, widget: number, required: false, hint: "How long after one word starts arriving the next one starts. Default: 110" }
                      - { label: "Headline words: wait after the loader (ms)", name: delay, widget: number, required: false, hint: "Pause between the loading screen going and the first word arriving. Default: 250" }
                      - { label: "Picture push-in on scroll", name: zoom, widget: number, value_type: float, required: false, hint: "How much the picture grows while you scroll through the first screen (0.12 = 12% bigger). Default: 0.12" }
                      - { label: "Picture push-in on scroll (phones)", name: zoomPhone, widget: number, value_type: float, required: false, hint: "The same on phones. Default: 0.08" }
                      - { label: "Darkening on scroll", name: dim, widget: number, value_type: float, required: false, hint: "How dark the picture gets by the end of the first screen (0 = none, 1 = black). Default: 0.55" }
                      - { label: "Phones: name into the header", name: nameMorph, widget: number, value_type: float, required: false, hint: "Phones only. The large name under the menu moves into the header over this share of the hero's height as you scroll (0.4 = the first 40%). Default: 0.4" }

          # -------------------------------------------------------- thread
          - name: thread
            label: "The through-line"
            summary: "Thread — {{fields.eyebrow}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Aria label, name: ariaLabel, widget: string }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: "Background images (drifting layers)", name: bg, widget: list, field: { label: Image, name: image, widget: image } }
              - label: Stations
                name: stations
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Gloss, name: gloss, widget: string, hint: "Allows *emphasis* and **bold**." }
                  - { label: "Pillar (larger, on the beat)", name: pillar, widget: boolean, default: false }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Sizes attribute, name: sizes, widget: string, default: "(max-width: 720px) 100vw, 520px" }
                      - { label: Alt text, name: alt, widget: string }
                      - { label: "Width (px, only if the source has no siblings)", name: width, widget: number, required: false }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Cursor drift (0–1)", name: cursor, widget: number, value_type: float, required: false, hint: "How far the pointer nudges the background. Default: 0.62" }

          # ------------------------------------------------------- patterns
          - name: patterns
            label: "How it shows up (patterns)"
            summary: "Patterns — {{fields.words.0.word}}…"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Aria label, name: ariaLabel, widget: string }
              - { label: "How (leading word)", name: how, widget: string, default: How }
              - { label: "Tail (trailing words)", name: tail, widget: string }
              - *placement
              - { label: "Hint (screen-reader, on hold)", name: hint, widget: string }
              - { label: "Previous-arrow label", name: prevLabel, widget: string }
              - { label: "Next-arrow label", name: nextLabel, widget: string }
              - { label: "Home-card label", name: homeLabel, widget: string }
              - { label: "Work-card label", name: workLabel, widget: string }
              - label: Words (2–9)
                name: words
                widget: list
                summary: "{{fields.word}}"
                fields:
                  - { label: Word (as it cycles), name: word, widget: string, hint: "Allows a soft hyphen; no other marks." }
                  - { label: Name (screen-reader), name: name, widget: string }
                  - { label: At home, name: home, widget: string }
                  - { label: At work, name: work, widget: string }
                  - { label: "Home photo (base path, no width or extension)", name: homeImg, widget: string, required: false }
                  - { label: "Work photo (base path, no width or extension)", name: workImg, widget: string, required: false }
              - label: Call to action
                name: cta
                widget: object
                fields:
                  - { label: Lead text, name: lead, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Auto-cycle period (ms)", name: period, widget: number, required: false, hint: "Default: 5000" }

          # --------------------------------------------------------- truth
          - name: truth
            label: "Recognition (surface → truth)"
            summary: "Truth — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Image
                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string }
                  - { label: Alt text, name: alt, widget: string }
              - { label: Heading, name: heading, widget: string }
              - *placement
              - label: Rows (surface / truth)
                name: rows
                widget: list
                summary: "{{fields.surface}}"
                fields:
                  - { label: Surface line, name: surface, widget: string }
                  - { label: Truth (revealed) line, name: under, widget: string }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: ink" }

          # --------------------------------------------------------- bleed
          - name: bleed
            label: "Cinematic bleed (the idea)"
            summary: "Bleed — {{fields.statement}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: "Live constellation canvas", name: constellation, widget: boolean, default: false }
              - label: Image
                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string }
                  - { label: Alt text, name: alt, widget: string }
              - { label: Statement, name: statement, widget: string, hint: "Allows *emphasis*." }
              - *placement
              - &settings-none
                label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum" }

          # ----------------------------------------------------------- why
          - name: why
            label: "Why Stephen"
            summary: "Why — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Portrait
                name: portrait
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string }
                  - { label: Alt text, name: alt, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text }
              - { label: Credentials, name: creds, widget: list, field: { label: Credential, name: cred, widget: string, hint: "Allows **bold**." } }
              - label: Link
                name: link
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - *placement
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: ink" }

          # --------------------------------------------------------- stats
          - name: stats
            label: "Stats (count-up)"
            summary: "Stats — {{fields.counters.0.label}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Extra CSS class, name: extraClass, widget: string, required: false }
              - { label: Aria label, name: ariaLabel, widget: string, required: false }
              - { label: "Note (build comment only, not shown to visitors)", name: note, widget: text, required: false }
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - label: Counters (any number)
                name: counters
                widget: list
                summary: "{{fields.value}}{{fields.suffix}} {{fields.label}}"
                fields:
                  - { label: Value, name: value, widget: number }
                  - { label: "Suffix (e.g. +)", name: suffix, widget: string, required: false }
                  - { label: Label, name: label, widget: string }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum-2" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Count-up duration (ms)", name: duration, widget: number, required: false, hint: "How long each digit takes to roll to its number. Default: 1500" }
                      - { label: "Odometer: gap between digit columns (ms)", name: stagger, widget: number, required: false, hint: "The rightmost digit rolls first; each column to its left starts this much later. Default: 60" }
                      - { label: "Count up (uncheck for still numbers)", name: countUp, widget: boolean, default: true, required: false, hint: "The count-up belongs to the homepage; other pages show the numbers still." }

          # ------------------------------------------------------- orgband
          - name: orgband
            label: "Credibility ribbon (trusted by / as seen on)"
            summary: "Orgband"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Aria label, name: ariaLabel, widget: string }
              - label: Lanes (each an endless scrolling row)
                name: lanes
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Small (secondary row), name: small, widget: boolean, default: false }
                  - { label: "Scroll speed (px/s; sign sets direction)", name: speed, widget: number, value_type: float }
                  - label: Logos
                    name: logos
                    widget: list
                    summary: "{{fields.alt}}"
                    fields:
                      - { label: Logo file, name: src, widget: image, media_folder: "/assets/logos", public_folder: "/assets/logos" }
                      - { label: Alt text (organization name), name: alt, widget: string }
                      - { label: "Knockout (recolour white for dark rows)", name: knockout, widget: boolean, default: false, required: false }
                      - { label: "Plate (white backing card)", name: plate, widget: boolean, default: false, required: false }
              - label: Call to action
                name: cta
                widget: object
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Spotlight tick (ms)", name: tick, widget: number, required: false, hint: "Default: 2600" }
                      - { label: "Spotlight tick, small row (ms)", name: tickSmall, widget: number, required: false, hint: "Default: 2400" }
                      - { label: "Spell duration (ms)", name: spell, widget: number, required: false, hint: "Default: 4200" }
                      - { label: "Glow reach (share of the row's width)", name: reach, widget: number, value_type: float, required: false, hint: "Logos brighten as they pass the middle of the row; at this distance from the middle (0.35 = 35% of the row's width either side) they are at their dimmest. Default: 0.35" }

          # ------------------------------------------------------- keynotes
          - name: keynotes
            label: "Three talks (keynote cards)"
            summary: "Keynotes — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Heading, name: heading, widget: string }
              - { label: Card CTA label, name: ctaLabel, widget: string, default: Explore }
              - { label: Layout, name: layout, widget: select, options: [strip, list], default: strip, required: false, hint: "strip: picture cards in a row the scroll slides sideways (like the speaking page's rooms). list: numbered rows with a hover picture." }
              - label: Cards
                name: cards
                widget: list
                summary: "{{fields.title}}{{fields.titleHtml}}"
                fields:
                  - { label: Tag (e.g. "Signature keynote"), name: tag, widget: string, required: false }
                  - { label: Title, name: title, widget: string, required: false, hint: "Plain text. Leave blank and use Title (HTML) below if it needs the ™ mark." }
                  - { label: "Title (HTML — only for a trademark ™ mark)", name: titleHtml, widget: string, required: false, hint: "Raw HTML, e.g. Lead Human<span class=\"tm\">™</span>. Leave blank and use Title above otherwise." }
                  - { label: Subtitle, name: sub, widget: text, hint: "Allows **bold**." }
                  - { label: Accent colour, name: accent, widget: select, options: [violet, coral, gold, teal, blue] }
                  - { label: Link, name: href, widget: string }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Sizes attribute, name: sizes, widget: string, default: 640px }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum-2" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Hover picture: how closely it follows the pointer", name: follow, widget: number, value_type: float, required: false, hint: "Share of the remaining distance it covers each frame (0.05 = lazy, 1 = glued to the pointer). Desktop mouse only. Default: 0.18" }
                      - { label: "Hover picture: fade in/out (ms)", name: fade, widget: number, required: false, hint: "Default: 220" }

          # ---------------------------------------------------------- care
          - name: care
            label: "Healthcare"
            summary: "Care — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Image
                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string }
                  - { label: Alt text, name: alt, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Lead, name: lead, widget: text, hint: "Allows *emphasis*." }
              - { label: "Lead inline style (advanced)", name: leadStyle, widget: string, required: false }
              - { label: Items, name: items, widget: list, field: { label: Item, name: item, widget: string } }
              - label: Call to action
                name: cta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: "Route line under the button (optional)"
                name: route
                widget: object
                required: false
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: Link label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - *placement
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum-2" }

          # --------------------------------------------------------- steps
          - name: steps
            label: "What happens when you book"
            summary: "Steps — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Aria label, name: ariaLabel, widget: string }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - label: Steps
                name: steps
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
              - label: Link
                name: link
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - *placement
              - label: "Final stage (the call to action)"
                name: final
                widget: object
                required: false
                fields:
                  - { label: "Id (anchor, e.g. contact)", name: id, widget: string, required: false }
                  - { label: Heading, name: heading, widget: string, hint: "Allows *emphasis*." }
                  - { label: Lead, name: lead, widget: text }
                  - { label: "Lead inline style (advanced)", name: leadStyle, widget: string, required: false }
                  - label: Buttons
                    name: buttons
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: "Link (leave blank if this button plays a video)", name: href, widget: string, required: false }
                      - { label: "Video file (leave blank if this button links)", name: video, widget: file, media_folder: "/assets/video", required: false }
                  - { label: "Show phone / email / socials", name: contacts, widget: boolean, default: true }
                  - *placement
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum-2" }

          # ------------------------------------------------------- reelHero
          - name: reelHero
            label: "Hero with video (speaking reel)"
            summary: "Reel hero"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Poster image
                name: poster
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
                  - { label: Alt text, name: alt, widget: string }
              - label: Video
                name: video
                widget: object
                fields:
                  - { label: Poster (frame), name: poster, widget: image }
                  - { label: Aria label, name: ariaLabel, widget: string }
                  - { label: "1080p file", name: src1080, widget: file, media_folder: "/assets/video" }
                  - { label: "720p file", name: src720, widget: file, media_folder: "/assets/video" }
                  - { label: "Mobile file", name: srcMobile, widget: file, media_folder: "/assets/video" }
                  - { label: "Autoplay on mobile (only if the mobile file is under 10 MB)", name: mobileAutoplay, widget: select, options: ["true", "false"], default: "true" }
              - label: Captions
                name: captions
                widget: object
                fields:
                  - { label: Captions file (.vtt), name: src, widget: file, media_folder: "/assets/video" }
                  - { label: Language code, name: srclang, widget: string, default: en }
                  - { label: Language label, name: label, widget: string, default: English }
              - { label: "Heading (the page's h1, shown under the reel)", name: heading, widget: string, hint: "Allows *emphasis*." }
              - { label: "Line under the heading (optional)", name: line, widget: string, required: false }
              - label: "Chapters under the reel (optional)"
                name: chapters
                widget: object
                required: false
                fields:
                  - { label: Heading, name: heading, widget: string }
                  - { label: Note, name: note, widget: string, required: false }
                  - label: Chapters
                    name: items
                    widget: list
                    summary: "{{fields.time}}s {{fields.label}}"
                    fields:
                      - { label: "Start (seconds into the reel)", name: time, widget: number, value_type: int }
                      - { label: Label, name: label, widget: string }
              - label: Labels
                name: labels
                widget: object
                fields:
                  - { label: Big play button, name: cta, widget: string }
                  - { label: Play control, name: play, widget: string }
                  - { label: Sound control, name: sound, widget: string }
                  - { label: Captions control, name: captions, widget: string }
              - *placement
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Poster parallax (0–1)", name: parallax, widget: number, value_type: float, required: false, hint: "Default: 0.5" }
                      - { label: "Phones: darkening as the next section covers it", name: dim, widget: number, value_type: float, required: false, hint: "Phones only: how dark the reel's picture gets as the next section slides up over it (0 = none, 1 = black). Default: 0.55" }
                      - { label: "Phones: name into the header", name: nameMorph, widget: number, value_type: float, required: false, hint: "Phones only. The large name under the menu moves into the header over this share of the hero's height as you scroll (0.4 = the first 40%). Default: 0.4" }

          # ----------------------------------------------------------- keys
          - name: keys
            label: "Three talks (pinned stage)"
            summary: "Keys — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Heading, name: heading, widget: string }
              - { label: "Position on the image (heading)", name: headingPlacement, widget: object, required: false, collapsed: true, fields: *placement-fields }
              - { label: "Tab list aria label", name: indexLabel, widget: string, default: Keynotes }
              - { label: '"Hear this" button label', name: hearLabel, widget: string, default: "Watch Stephen speak" }
              - { label: Pause button label, name: pauseLabel, widget: string, default: Pause }
              - label: "Rest image (before any talk plays)"
                name: rest
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
              - label: Shared reel video (for the "hear this" clips)
                name: video
                widget: object
                fields:
                  - { label: "1080p file", name: src1080, widget: file, media_folder: "/assets/video" }
                  - { label: "Mobile file", name: srcMobile, widget: file, media_folder: "/assets/video" }
              - label: Captions
                name: captions
                widget: object
                fields:
                  - { label: Captions file (.vtt), name: src, widget: file, media_folder: "/assets/video" }
                  - { label: Language code, name: srclang, widget: string, default: en }
                  - { label: Language label, name: label, widget: string, default: English }
              - label: "Talks (2–5)"
                name: talks
                widget: list
                summary: "{{fields.title}}{{fields.titleHtml}}"
                fields:
                  - { label: Title, name: title, widget: string, required: false, hint: "Plain text. Leave blank and use Title (HTML) below if it needs the ™ mark." }
                  - { label: "Title (HTML — only for a trademark ™ mark)", name: titleHtml, widget: string, required: false, hint: "Raw HTML, e.g. Lead Human<span class=\"tm\">™</span>. Leave blank and use Title above otherwise." }
                  - { label: Subtitle, name: sub, widget: string }
                  - { label: Accent colour, name: accent, widget: select, options: [violet, coral, gold, teal, blue] }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
                  - label: "Segment (this talk's slice of the reel)"
                    name: segment
                    widget: object
                    fields:
                      - { label: "Start (seconds into the reel)", name: start, widget: number, value_type: float }
                      - { label: "End (seconds into the reel)", name: end, widget: number, value_type: float }
                      - { label: "Poster frame (seconds)", name: poster, widget: number, value_type: float }
                  - *placement
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: transparent" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Heading-alone stage length (svh)", name: head, widget: number, required: false, hint: "The stage picture fading up and its heading, before the first talk. Default: 240" }
                      - { label: "Scroll per talk panel (svh)", name: panel, widget: number, required: false, hint: "Default: 80" }

          # ----------------------------------------------------------- chap
          - name: chap
            label: "In the room: Think / Feel / Act"
            summary: "Chap — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Heading, name: heading, widget: string }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: "Tab rail aria label", name: railLabel, widget: string, default: Chapters }
              - { label: "Strike the word through when its line arrives (for said-vs-meant pairs)", name: strike, widget: boolean, default: false, required: false, hint: "On: each chapter's word stays when its line arrives, moves up, shrinks and gets a line drawn through it; the line appears underneath. Off: the word leaves before its line arrives." }
              - { label: "Position on the image (the rail)", name: railPlacement, widget: object, required: false, collapsed: true, fields: *placement-fields }
              - label: Chapters
                name: chapters
                widget: list
                summary: "{{fields.word}}"
                fields:
                  - { label: Word (the tab), name: word, widget: string }
                  - { label: Text, name: text, widget: text, hint: "Allows one *emphasis* word (styled as the chapter's key word)." }
                  - { label: Tone, name: tone, widget: select, options: [violet, bone] }
                  - { label: "Spot (where the type sits)", name: spot, widget: select, options: [c, ul, lr], hint: "c: centred on the picture. ul: upper left. lr: lower right." }
                  - label: "The turn (optional): a second line and picture"
                    name: turn
                    widget: object
                    required: false
                    collapsed: true
                    hint: "The word stays on top; the text changes to this line and the picture changes to this one as you scroll."
                    fields:
                      - { label: Text, name: text, widget: text, required: false, hint: "Allows one *emphasis* word." }
                      - label: Picture
                        name: still
                        widget: object
                        required: false
                        fields:
                          - { label: Image, name: src, widget: image, required: false }
                          - { label: Sizes attribute, name: sizes, widget: string, default: 100vw, required: false }
                  - *placement
                  - label: Still image
                    name: still
                    widget: object
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum-2" }
                  - { label: "Darken the pictures (0 = none, 0.5 = half)", name: veil, widget: number, value_type: float, min: 0, max: 0.8, step: 0.05, required: false, hint: "A plum veil over the chapter pictures so the words read on bright photos. 0 to 0.8. Default: 0 (none)" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Scroll per chapter beat (vh)", name: beat, widget: number, required: false, hint: "Default: 70" }
                      - { label: "Scroll per chapter on phones (svh)", name: beatPhone, widget: number, required: false, hint: "Scroll per chapter on phones. Default: 100" }
                      - { label: "Arrive fade (ms)", name: arrive, widget: number, required: false, hint: "Default: 440" }
                      - { label: "Leave fade (ms)", name: leave, widget: number, required: false, hint: "Default: 320" }
                      - { label: "Still crossfade (ms)", name: cross, widget: number, required: false, hint: "Default: 900" }
                      - { label: "Still dolly-in scale", name: dolly, widget: number, value_type: float, required: false, hint: "Default: 1.06" }
                      - { label: "Strike line draw (ms)", name: strikeDraw, widget: number, required: false, hint: "Only with the strike option on: how long the line takes to draw through the word. Default: 420" }

          # ------------------------------------------------------------ out
          - name: out
            label: "What the room walks out with"
            summary: "Out — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Image
                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
              - { label: Heading, name: heading, widget: string, required: false, hint: "Optional. Leave empty for a statement made only of the words." }
              - { label: "Label for screen readers (no heading)", name: label, widget: string, required: false, hint: "Used only when there is no heading: what a screen reader announces for the section. Leave empty to use the words joined." }
              - { label: "Position on the image (heading)", name: headingPlacement, widget: object, required: false, collapsed: true, fields: *placement-fields }
              - label: Words (scattered)
                name: words
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: "X position (% from left)", name: x, widget: string, hint: "e.g. 26%" }
                  - { label: "Y position (% from top)", name: y, widget: string, hint: "e.g. 70%" }
                  - { label: Layer, name: layer, widget: select, options: [front, back] }
                  - { label: Size, name: size, widget: select, options: [lg, xl], default: lg, required: false, hint: "xl = 1.6 times the normal word size. Text allows *emphasis*." }
                  - *placement
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: transparent" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Word step distance (px)", name: step, widget: number, required: false, hint: "Default: 380" }
                      - { label: "Rise stage length (px)", name: rise, widget: number, required: false, hint: "Default: 600" }

          # -------------------------------------------------------- formats
          - name: formats
            label: "Rooms he speaks to (formats)"
            summary: "Formats — {{fields.heading}}"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Aria label, name: ariaLabel, widget: string }
              - { label: Sentence, name: sentence, widget: text, hint: "Allows *emphasis*." }
              - *placement
              - { label: Heading, name: heading, widget: string }
              - { label: '"usually:" label', name: usuallyLabel, widget: string, required: false }
              - { label: "Table header: event (screen readers)", name: eventsLabel, widget: string, required: false }
              - { label: "Table header: talk (screen readers)", name: talkLabel, widget: string, required: false }
              - label: "Event types (the table; used when present)"
                name: events
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Event, name: label, widget: string }
                  - label: Usual talk
                    name: talk
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string, required: false }
              - { label: "Room image sizes attribute (photo grid)", name: sizes, widget: string, default: 70vw, required: false }
              - label: "Rooms (older photo grid; only when there are no event types)"
                name: rooms
                required: false
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { label: Caption, name: caption, widget: string }
                  - { label: "Note under the caption (optional)", name: note, widget: string, required: false, hint: "e.g. when the photo is not of that kind of room" }
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { label: Image, name: src, widget: image }
                      - { label: Alt text, name: alt, widget: string, required: false }
                      - { label: Focus point (optional), name: position, widget: string, required: false, hint: "Where the crop centres, across then down, e.g. 50% 12%" }
              - { label: "Seat rows behind the sentence", name: seats, widget: boolean, default: true, required: false }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: transparent" }

          # ------------------------------------------------------------ bio
          - name: bio
            label: "The diptych: portrait & for planners"
            summary: "Bio"
            fields:
              - { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - label: Portrait
                name: portrait
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string }
                  - { label: Alt text, name: alt, widget: string }
              - { label: Line (one sentence), name: line, widget: string }
              - label: Link
                name: link
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - { label: '"For planners" heading', name: plannersHeading, widget: string, default: "For planners." }
              - { label: Outcomes label, name: outcomesLabel, widget: string, default: "What each talk leaves behind" }
              - label: Outcomes (one per talk)
                name: outcomes
                widget: list
                summary: "{{fields.title}}{{fields.titleHtml}}"
                fields:
                  - { label: Title, name: title, widget: string, required: false, hint: "Plain text. Leave blank and use Title (HTML) below if it needs the ™ mark." }
                  - { label: "Title (HTML — only for a trademark ™ mark)", name: titleHtml, widget: string, required: false, hint: "Raw HTML, e.g. Lead Human<span class=\"tm\">™</span>. Leave blank and use Title above otherwise." }
                  - { label: Text, name: text, widget: text }
              - { label: Tailoring label, name: tailoringLabel, widget: string, default: Tailoring }
              - { label: Tailoring text, name: tailoring, widget: text }
              - { label: '"On the day" label', name: onDayLabel, widget: string, default: "On the day" }
              - { label: "On-the-day requirements", name: onDay, widget: list, field: { label: Item, name: item, widget: string } }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: transparent" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Portrait drift (0–1)", name: drift, widget: number, value_type: float, required: false, hint: "Default: 0.04" }

          # ================= Healthcare, About and Book blocks =================
          # ------------------------------------------------------- hc-hero
          - name: hc-hero
            label: "Healthcare: opening"
            summary: "Healthcare opening — {{fields.heading}}"
            fields:
              - &hcab-id { label: Block id, name: id, widget: string, hint: "Anchor for links; must be unique on the page." }
              - &hcab-anchor { label: Anchor (uncheck to hide the id), name: anchor, widget: boolean, default: true, required: false }
              - &hcab-enabled { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Heading, name: heading, widget: string, hint: "Allows *emphasis* (set in the healthcare teal)." }
              - { label: Lead, name: lead, widget: text }
              - label: Photo
                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, required: false }
                  - { label: Alt text, name: alt, widget: string }
                  - { label: "Focus point (object-position)", name: position, widget: string, required: false, hint: "e.g. 50% 30%" }
              - label: Button
                name: cta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Text link (optional)
                name: link
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string, required: false }
                  - { label: Link, name: href, widget: string, required: false }
              - *settings-none

          # -------------------------------------------------------- hc-who
          - name: hc-who
            label: "Healthcare: who it is for"
            summary: "Who it is for — {{fields.heading}}"
            fields:
              - *hcab-id
              - *hcab-anchor
              - *hcab-enabled
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Line, name: text, widget: string, required: false }
              - *settings-none

          # -------------------------------------------------------- hc-out
          - name: hc-out
            label: "Healthcare: what the room walks out with (five words)"
            summary: "Five words — {{fields.heading}}"
            fields:
              - *hcab-id
              - *hcab-anchor
              - *hcab-enabled
              - { label: Heading, name: heading, widget: string, hint: "Allows *emphasis*." }
              - label: Image
                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, default: 100vw }
              - label: Words (in the order they light)
                name: words
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: "X position (% from left, wide screens)", name: x, widget: string, hint: "e.g. 28%" }
                  - { label: "Y position (% from top, wide screens)", name: y, widget: string, hint: "e.g. 36%" }
                  - { label: Layer, name: layer, widget: select, options: [front, back], hint: "front = larger" }
                  - { label: Size, name: size, widget: select, options: [lg, xl], default: lg, required: false }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Time between words (ms)", name: step, widget: number, required: false, hint: "Default: 380" }
                      - { label: "Word rise (ms)", name: rise, widget: number, required: false, hint: "Default: 600" }

          # ------------------------------------------------------- hc-talk
          - name: hc-talk
            label: "Healthcare: the session (lifting stack)"
            summary: "Talk — {{fields.title}}"
            fields:
              - *hcab-id
              - *hcab-anchor
              - *hcab-enabled
              - { label: Editor note (never shown on the site), name: editorNote, widget: text, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - { label: Overview, name: overview, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
              - { label: Formats label, name: formatsLabel, widget: string, default: Formats }
              - { label: Formats, name: formats, widget: list, field: { label: Format, name: format, widget: string } }
              - label: Button
                name: cta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Text link (optional)
                name: link
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string, required: false }
                  - { label: Link, name: href, widget: string, required: false }
              - { label: Label over the carried lines, name: carryLabel, widget: string }
              - { label: What caregivers carry (each line lifts away), name: carried, widget: list, field: { label: Line, name: line, widget: string } }
              - label: The line that stays (does not lift)
                name: kept
                widget: object
                required: false
                fields:
                  - { label: Line, name: line, widget: string, required: false }
                  - { label: Note beside it, name: note, widget: string, required: false }
              - { label: Label over the outcomes, name: outcomesLabel, widget: string }
              - { label: Outcomes, name: outcomes, widget: list, field: { label: Outcome, name: outcome, widget: string } }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false, hint: "Default: plum-2" }
                  - label: Motion
                    name: motion
                    widget: object
                    required: false
                    fields:
                      - { label: "Scroll for the whole stack (screens)", name: span, widget: number, value_type: float, required: false, hint: "Default: 0.45" }
                      - { label: "One line lifting (ms)", name: lift, widget: number, required: false, hint: "Default: 640" }
                      - { label: "Each outcome coming up (ms)", name: settle, widget: number, required: false, hint: "Default: 520" }

          # ------------------------------------------------------ hc-logos
          - name: hc-logos
            label: "Healthcare: client logos (static)"
            summary: "Logos — {{fields.heading}}"
            fields:
              - *hcab-id
              - *hcab-anchor
              - *hcab-enabled
              - { label: Heading, name: heading, widget: string }
              - &hcab-logos
                label: Logos
                name: logos
                widget: list
                summary: "{{fields.alt}}"
                fields:
                  - { label: Logo, name: src, widget: image, hint: "A transparent PNG or WebP; it is shown as a cream silhouette." }
                  - { label: Name (alt text), name: alt, widget: string }
                  - { label: Treatment, name: treatment, widget: select, options: [mono, plate], default: mono, required: false, hint: "plate = a mark that is its own coloured box (shown in grey instead of as a silhouette)" }
                  - { label: Size (1 = normal), name: scale, widget: string, required: false, hint: "e.g. 0.8 for a wide mark" }
              - *settings-none

          # --------------------------------------------------- ab-portrait
          - name: ab-portrait
            label: "About: portrait (the portrait's lights)"
            summary: "Portrait — {{fields.name}}"
            fields:
              - *hcab-id
              - *hcab-anchor
              - *hcab-enabled
              - { label: Name (page heading), name: name, widget: string }
              - { label: Category line, name: category, widget: string }
