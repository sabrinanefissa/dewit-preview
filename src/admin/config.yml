              - { label: Paused (announced), name: paused, widget: string }
              - { label: "Rolling resumed (announced)", name: rollingResumed, widget: string }
              - { label: "Headings fill with colour as you scroll", name: fillHeadings, widget: select, options: [phone, all, "off"], default: phone, required: false, hint: "Each heading's words start faint and fill in as the heading scrolls up the screen. phone = phones only, all = every screen, off = never. Default: phone" }
              - { label: "Heading fill: starts at (share of the screen)", name: fillStart, widget: number, value_type: float, required: false, hint: "The fill starts when the heading's top passes this point of the screen, from the top (0.85 = 85% down). Default: 0.85" }
              - { label: "Heading fill: ends at (share of the screen)", name: fillEnd, widget: number, value_type: float, required: false, hint: "The heading is fully filled when its top reaches this point (0.45 = 45% down). Default: 0.45" }
              - { label: "Heading fill: gap between words", name: fillStagger, widget: number, value_type: float, required: false, hint: "How far behind the previous word each word fills (0 = all together). Default: 0.12" }
          - label: "Brand link (top-left wordmark)"
            name: brandLink
            widget: object
            fields:
              - { label: Link, name: href, widget: string }
              - label: "Per-page overrides"
                name: overrides
                widget: object
                required: false
                fields:
                  - { label: On the homepage, name: home, widget: string, required: false }
          - label: Primary navigation
            name: nav
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
              - { label: "Page slug (marks this link current on that page)", name: slug, widget: string, required: false }
          - label: "Header call to action"
            name: cta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Blurb, name: blurb, widget: text }
              - { label: "Blurb inline style (advanced)", name: blurbStyle, widget: string, required: false }
              - label: "Explore column"
                name: explore
                widget: object
                fields:
                  - { label: Heading, name: heading, widget: string }
                  - label: Links
                    name: links
                    widget: list
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Link, name: href, widget: string }
                      - { label: "Page slug (marks this link current on that page)", name: slug, widget: string, required: false }
                      - label: "Per-page overrides"
                        name: overrides
                        widget: object
                        required: false
                        fields:
                          - { label: On the homepage, name: home, widget: string, required: false }
              - label: "Connect column"
                name: connect
                widget: object
                fields:
                  - { label: Heading, name: heading, widget: string }
          - label: "Speaking-reel lightbox (shown when the reel isn't linked yet)"
            name: lightbox
            widget: object
            fields:
              - { label: Aria label, name: label, widget: string }
              - { label: Close symbol, name: close, widget: string }
              - { label: Close aria label, name: closeLabel, widget: string }
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: "CTA inline style (advanced)", name: ctaStyle, widget: string, required: false }
              - label: Call to action
                name: cta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }

