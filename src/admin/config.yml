                name: image
                widget: object
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Sizes attribute, name: sizes, widget: string, required: false }
                  - { label: Alt text, name: alt, widget: string }
                  - { label: Focus point (optional), name: position, widget: string, required: false, hint: "Where the crop centres, across then down, e.g. 25% 40%" }
              - { label: Jump row label (for screen readers), name: jumpLabel, widget: string, default: Jump to a keynote, required: false }
              - { label: '"Book this talk" button label', name: bookLabel, widget: string, default: Book this talk, required: false, hint: "Links to the booking form with this talk already chosen." }
              - label: Settings
                name: settings
                widget: object
                required: false
                fields:
                  - { label: Background, name: background, widget: select, options: [plum, plum-2, ink, paper, transparent], required: false }
                  - { label: Photo on the left, name: flip, widget: boolean, default: false, required: false }
