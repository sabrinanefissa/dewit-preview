                  - { label: Hint under the heading, name: hint, widget: string, required: false }
                  - { label: Continue button (step 1), name: next, widget: string, required: false }
                  - { label: Back button (step 2), name: back, widget: string, required: false }
              - label: Fields
                name: fields
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Step, name: step, widget: select, options: [1, 2], default: 1 }
                  - { label: "Name (used in the email and the WordPress form mapping; keep the existing names as they are)", name: name, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Type, name: type, widget: select, options: [text, email, tel, textarea, select, radio] }
                  - { label: Hint under the label, name: hint, widget: string, required: false }
                  - { label: Required, name: required, widget: boolean, default: false, required: false }
                  - { label: Message when empty, name: errorMessage, widget: string, required: false }
                  - { label: Message when not a valid email, name: invalidMessage, widget: string, required: false }
                  - { label: Autocomplete, name: autocomplete, widget: string, required: false, hint: "e.g. name, email, organization, organization-title, off" }
                  - { label: Keyboard (inputmode), name: inputmode, widget: string, required: false, hint: "e.g. email, numeric" }
                  - { label: Spellcheck, name: spellcheck, widget: boolean, required: false }
                  - label: Options (select and radio)
                    name: options
                    widget: list
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: Value (sent in the email), name: value, widget: string }
                  - { label: Pre-selected option (its value), name: default, widget: string, required: false }
                  - { label: "Fill from the link (?talk=)", name: prefill, widget: string, required: false, hint: "Only the talk field uses this." }
                  - { label: Value when ticked (checkbox), name: value, widget: string, required: false }
                  - label: Only show when
                    name: showIf
                    widget: object
                    required: false
                    fields:
                      - { label: Field name, name: field, widget: string, required: false }
                      - { label: Has value, name: value, widget: string, required: false }
                  - { label: Empty option (select), name: emptyOption, widget: string, required: false }
                  - { label: Rows (textarea), name: rows, widget: number, required: false }
                  - { label: Full width, name: wide, widget: boolean, default: false, required: false }
              - { label: Button label, name: submit, widget: string }
              - { label: Note beside the button (the email address follows it), name: note, widget: string }
              - { label: Message after the email app opens, name: sentMessage, widget: text }
              - { label: Privacy line (shown on both steps), name: privacy, widget: string, required: false }
              - label: Confirmation panel
                name: done
                widget: object
                required: false
                fields:
                  - { label: Heading, name: heading, widget: string }
                  - { label: Text (the email address follows it), name: text, widget: text }
                  - { label: Edit button, name: edit, widget: string }
                  - { label: Open-again button, name: again, widget: string }
              - label: The email it writes
                name: mail
                widget: object
                fields:
                  - { label: Subject (the organization and date are added), name: subject, widget: string }
                  - { label: First line, name: intro, widget: string }
                  - { label: Shown for a field left empty, name: empty, widget: string }
              - *settings-none

          # ------------------------------------------------------ bk-steps
          - name: bk-steps
            label: "Book: what happens next"
            summary: "Steps — {{fields.heading}}"
            fields:
              - *hcab-id
              - *hcab-anchor
              - *hcab-enabled
              - { label: Heading, name: heading, widget: string }
              - label: Steps
                name: steps
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: string }
