              - { label: Show on page, name: enabled, widget: boolean, default: true }
              - { label: Editor note (never shown on the site), name: editorNote, widget: text, required: false, hint: "e.g. Unconfirmed as an official talk." }
              - { label: Title, name: title, widget: string }
              - { label: Trademark ™ after the title, name: trademark, widget: boolean, default: false, required: false }
              - { label: Signature talk (larger title), name: signature, widget: boolean, default: false, required: false }
