                  - { label: Sizes attribute, name: sizes, widget: string, required: false }
                  - { label: Alt text, name: alt, widget: string }
                  - { label: Caption, name: caption, widget: string, required: false }
                  - { label: "Focus point (object-position)", name: position, widget: string, required: false }
              - *settings-none

          # ------------------------------------------------------ ab-creds
          - name: ab-creds
            label: "About: credentials"
            summary: "Credentials — {{fields.heading}}"
