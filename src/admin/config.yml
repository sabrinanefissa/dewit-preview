                fields:
                  - { label: Heading, name: heading, widget: string, default: Stage introduction }
                  - { label: Note, name: note, widget: string, required: false }
                  - { label: Copy button label, name: copyLabel, widget: string, default: Copy introduction }
                  - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
              - label: Downloads
                name: downloads
                widget: object
                fields:
                  - { label: Heading, name: heading, widget: string, default: Downloads }
                  - label: Files
                    name: items
                    widget: list
                    summary: "{{fields.label}} ({{fields.format}}, {{fields.size}})"
